name: Release Android

# Se ejecuta al subir una etiqueta de versión, por ejemplo:  git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write # necesario para crear el Release y adjuntar la APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # La clave de firma vive en los secretos del repositorio, nunca en el código.
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Falta el secreto KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Compilar APK
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_URL="$API_URL"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/coco-loco-$VERSION-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/coco-loco-$VERSION-armv7.apk"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Instalar en Android
            Descarga **`coco-loco-*-arm64.apk`** (casi todos los móviles actuales; si no instala, usa `armv7`),
            ábrelo en el teléfono y permite "instalar apps de origen desconocido".
