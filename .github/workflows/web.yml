name: Web (build para Coolify)

# Compila la web en GitHub (memoria de sobra) y publica el resultado en la rama `web-dist`.
# Coolify despliega esa rama con un Dockerfile ligero (solo nginx), sin compilar Flutter en el servidor.
on:
  push:
    branches: [main]
    # Solo cuando cambia algo que afecta a la web (no el backend ni Android).
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'nginx.conf'
      - 'deploy/web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write # necesario para actualizar la rama web-dist

concurrency:
  group: web-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - run: flutter pub get

      - name: Compilar web
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          URL="${API_URL:-https://cocoloco.sbs.mom}"
          echo "Compilando con API_URL=$URL"
          # El número de compilación cambia en cada ejecución: así cada despliegue es una versión distinta.
          flutter build web --release --no-wasm-dry-run --build-number="${{ github.run_number }}" --dart-define=API_URL="$URL"

      - name: Sellar la versión (main.dart.<versión>.js y version.json)
        run: |
          # Renombra el juego a main.dart.<versión>.js y apunta flutter_bootstrap.js a ese nombre. Sin esto el
          # navegador reutiliza su copia guardada de main.dart.js y sigue ejecutando la versión vieja aunque el
          # servidor ya tenga la nueva. Si Flutter cambia su formato, este paso FALLA (no publica a medias).
          node deploy/web/stamp-web.mjs build/web "${GITHUB_SHA::7}" "${{ github.run_number }}"
          cat build/web/version.json
          ls build/web | grep '^main\.dart\.'

      - name: Publicar en la rama web-dist
        run: |
          rm -rf "$RUNNER_TEMP/dist"
          mkdir -p "$RUNNER_TEMP/dist"
          cp -r build/web "$RUNNER_TEMP/dist/site"
          # Limpia el service worker viejo de los dispositivos que ya abrieron el juego.
          cp deploy/web/cleanup_service_worker.js "$RUNNER_TEMP/dist/site/flutter_service_worker.js"
          cp deploy/web/Dockerfile deploy/web/updater.sh deploy/web/40-self-update.sh nginx.conf "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          git init -q
          git checkout -q -b web-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web compilada desde ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin web-dist

      - name: Redesplegar en Coolify
        # Sin este paso hay que pulsar "Redeploy" a mano después de cada cambio (y se olvida).
        # Configura dos secretos del repositorio (ver DEPLOY.md): COOLIFY_DEPLOY_URL y COOLIFY_TOKEN.
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::Faltan los secretos COOLIFY_DEPLOY_URL y COOLIFY_TOKEN: pulsa Redeploy a mano en Coolify (o configúralos, ver DEPLOY.md)."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_DEPLOY_URL"
          echo
          echo "Despliegue solicitado a Coolify."
