server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Archivos que cambian en cada versión: nunca se cachean.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # El juego (main.dart.<versión>.js) lleva la versión en el NOMBRE (lo sella deploy/web/stamp-web.mjs en
    # cada compilación): un nombre nuevo no puede estar en la caché de nadie, así que este archivo sí puede
    # guardarse para siempre. Eso es lo que impide que un navegador se quede con una versión vieja.
    location ~* ^/main\.dart\.[A-Za-z0-9_-]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Todo lo demás conserva su nombre entre versiones (fuentes, imágenes, otros .js): el navegador puede
    # guardarlo, pero tiene que preguntar al servidor si cambió (ETag) antes de usarlo. Nunca se queda viejo.
    location ~* \.(?:js|mjs|css|wasm|otf|ttf|woff2?|png|jpg|jpeg|svg|ico|bin)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
