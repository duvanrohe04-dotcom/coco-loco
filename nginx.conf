server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Archivos que cambian en cada versión: nunca se cachean.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # El código (js/wasm/css) conserva el mismo nombre en cada versión: se guarda, pero el navegador
    # pregunta siempre si cambió (ETag), así nadie se queda con una versión vieja.
    location ~* \.(?:js|css|wasm)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Fuentes e imágenes: caché larga (una semana).
    location ~* \.(?:otf|ttf|woff2?|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
